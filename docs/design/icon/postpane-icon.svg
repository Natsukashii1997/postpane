<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
    <!-- 共用：图标表面的柔光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- 一 · 一枝春 -->
    <linearGradient id="p-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <radialGradient id="p-moon" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fbf5e9"/><stop offset=".7" stop-color="#eee2c8"/><stop offset="1" stop-color="#ddc9a2"/>
    </radialGradient>
    <clipPath id="p-clip"><rect width="1024" height="1024" rx="230"/></clipPath>
    <g id="blossom">
      <circle cx="0" cy="-26" r="24"/><circle cx="25" cy="-8" r="24"/><circle cx="15" cy="21" r="24"/>
      <circle cx="-15" cy="21" r="24"/><circle cx="-25" cy="-8" r="24"/>
    </g>
    <symbol id="icon-plum" viewBox="0 0 1024 1024">
      <g clip-path="url(#p-clip)">
        <rect width="1024" height="1024" fill="url(#p-night)"/>
        <circle cx="540" cy="470" r="318" fill="none" stroke="#c4a46a" stroke-width="10" opacity=".85"/>
        <circle cx="540" cy="470" r="296" fill="url(#p-moon)"/>
